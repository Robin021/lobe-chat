<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Favicon - Porsche Inspired Lens">
  <defs>
    <!-- Background gradient (auto-adapts to theme) -->
    <linearGradient id="gLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D1F24"/>
      <stop offset="100%" stop-color="#0E0F13"/>
    </linearGradient>
    <linearGradient id="gDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0B0E"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <style>
      :root { --bgfill: url(#gLight); }
      @media (prefers-color-scheme: dark) { :root { --bgfill: url(#gDark); } }
      .bg { fill: var(--bgfill); }
    </style>
  </defs>

  <!-- Badge background -->
  <circle class="bg" cx="12" cy="12" r="11"/>

  <!-- Minimal professional lens with Porsche-inspired palette -->
  <!-- Outer lens ring in champagne gold -->
  <circle cx="12" cy="12" r="5.2" fill="none" stroke="#C8A15D" stroke-width="1.6"/>
  <!-- Red accent tick along the ring (guards red) -->
  <path d="M14.6 6.9 A5.2 5.2 0 0 1 15.7 7.6" fill="none" stroke="#E10600" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Inner pupil in ivory -->
  <circle cx="12" cy="12" r="1.6" fill="#F2F2F2"/>
</svg>
